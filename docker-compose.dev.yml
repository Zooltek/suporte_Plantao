# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.dev.yml — DEV OVERLAY
#
# Conveniências de desenvolvimento:
#   - Bind-mount do código para live reload (app + worker)
#   - `make dev` também atende homologação compartilhada por IP/hostname
#   - HMR permanece local por padrão; acessos remotos caem para assets buildados
#   - Serviços extras: Vite (HMR), Adminer (GUI do MySQL), Evolution API (WhatsApp)
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# ──────────────────────────────────────────────────────────────────────────────

services:
  # O MySQL NÃO publica porta no host por padrão — evita conflito quando a 3306
  # já está em uso por outro MySQL/container na máquina. Os serviços acessam o
  # banco pela rede interna `plantao12_net`; para GUI use o Adminer (:8082) ou
  # `make mysql`. Para expor a porta no host (ex.: DBeaver/Workbench), use o
  # overlay opt-in: `make dev DB_EXPOSE=1` (ver docker-compose.dbport.yml).

  plantao12_app:
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:8095:8080"
    environment:
      APP_URL: http://localhost:8095
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      WHATSAPP_WEBHOOK_URL: http://plantao12_app:8080/api/webhook/whatsapp
      # Responsável por instalar/atualizar o vendor/ no boot (o bind-mount esconde
      # o vendor/ da imagem). Worker e demais containers aguardam o vendor/ ficar
      # pronto — evita corrida de composer install no mesmo diretório montado.
      COMPOSER_AUTO_INSTALL: "1"
    volumes:
      - .:/var/www/html

  plantao12_worker:
    environment:
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      WHATSAPP_WEBHOOK_URL: http://plantao12_app:8080/api/webhook/whatsapp
    volumes:
      - .:/var/www/html

  # ==========================
  # VITE / FRONTEND (HMR)
  # ==========================
  plantao12_vite:
    image: node:20-alpine
    container_name: plantao12_vite
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - plantao12_node_modules:/var/www/html/node_modules
    ports:
      - "${VITE_BIND_ADDRESS:-127.0.0.1}:5178:5173"
    env_file:
      - .env
    environment:
      VITE_HOST: 0.0.0.0
      VITE_PUSHER_APP_KEY: ${PUSHER_APP_KEY:-local}
      VITE_PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-mt1}
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - plantao12_net

  # ==========================
  # ADMINER (GUI MySQL — só dev)
  # ==========================
  plantao12_adminer:
    image: adminer:latest
    container_name: plantao12_adminer
    ports:
      - "${ADMINER_BIND_ADDRESS:-127.0.0.1}:${ADMINER_PORT:-8083}:8080"
    depends_on:
      - plantao12_mysql
    networks:
      - plantao12_net

  # ==========================
  # EVOLUTION API v2 (WhatsApp — só dev)
  # ==========================
  plantao12_evolution:
    image: ${EVOLUTION_API_IMAGE:-evoapicloud/evolution-api:v2.3.6}
    container_name: plantao12_evolution
    restart: unless-stopped
    # Aguarda o MySQL e o Redis ficarem saudáveis antes de subir — sem isso a
    # Evolution dispara o `prisma migrate deploy` antes do banco aceitar conexão
    # e falha com P1001 ("Can't reach database server") em loop no boot.
    depends_on:
      plantao12_mysql:
        condition: service_healthy
      plantao12_redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:8080"
    environment:
      SERVER_URL: http://localhost:8091
      AUTHENTICATION_API_KEY: ${WHATSAPP_EVOLUTION_API_KEY:-amura-local-evo-key-2024}
      DATABASE_PROVIDER: mysql
      DATABASE_CONNECTION_URI: "mysql://root:${DB_ROOT_PASSWORD}@plantao12_mysql:3306/evolution_db_237"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      LOG_LEVEL: DEBUG,INFO,WARN,ERROR,WEBHOOKS
      LOG_COLOR: "true"
      LOG_BAILEYS: warn
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "30"
      QRCODE_EXPIRATION_TIME: "45"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://plantao12_redis:6379"
      CACHE_REDIS_PREFIX_KEY: "evolution"
      CACHE_REDIS_SAVE_INSTANCES: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: "http://plantao12_app:8080/api/webhook/whatsapp?apikey=${WHATSAPP_EVOLUTION_API_KEY:-amura-local-evo-key-2024}"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_SET: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    volumes:
      - plantao12_evolution_data_237:/evolution/instances
    networks:
      - plantao12_net

  # ==========================
  # SELENIUM / BROWSER TESTS
  # ==========================
  plantao12_selenium:
    profiles: ["browser"]
    image: selenium/standalone-chrome:latest
    container_name: plantao12_selenium
    restart: unless-stopped
    shm_size: 2gb
    networks:
      - plantao12_net

volumes:
  plantao12_node_modules:
  plantao12_evolution_data_237:

