# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.lan.yml — OVERLAY LEGADO DE TESTE COMPARTILHADO
#
# Status:
#   - Mantido apenas para compatibilidade manual.
#   - O fluxo recomendado agora é `make dev`, que já cobre desenvolvimento
#     e homologação compartilhada sem troca de ambiente.
#   - Selenium saiu deste overlay e virou serviço opcional do `make browser-up`.
#
# Uso:
#   make dev
#   APP_PUBLIC_URL=http://IP-OU-HOST:8095 make dev
#
# Observação:
#   - `APP_PUBLIC_URL` é opcional.
#   - Quando informado, o entrypoint sobrescreve `APP_URL` para fluxos que
#     dependem de URL absoluta fora do contexto da request HTTP.
# ──────────────────────────────────────────────────────────────────────────────

services:
  plantao12_app:
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:8095:8080"
    environment:
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      WHATSAPP_WEBHOOK_URL: http://plantao12_app:8080/api/webhook/whatsapp

  plantao12_worker:
    environment:
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      WHATSAPP_WEBHOOK_URL: http://plantao12_app:8080/api/webhook/whatsapp

  plantao12_evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: plantao12_evolution
    restart: unless-stopped
    environment:
      SERVER_URL: http://plantao12_evolution:8080
      AUTHENTICATION_API_KEY: ${WHATSAPP_EVOLUTION_API_KEY:-amura-local-evo-key-2024}
      DATABASE_PROVIDER: mysql
      DATABASE_CONNECTION_URI: "mysql://root:${DB_ROOT_PASSWORD}@plantao12_mysql:3306/evolution_db_237"
      LOG_LEVEL: DEBUG
      LOG_COLOR: "true"
      LOG_BAILEYS: warn
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "30"
      QRCODE_EXPIRATION_TIME: "45"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://plantao12_redis:6379"
      CACHE_REDIS_PREFIX_KEY: "evolution"
      CACHE_REDIS_SAVE_INSTANCES: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
    volumes:
      - plantao12_evolution_data_237:/evolution/instances
    networks:
      - plantao12_net

volumes:
  plantao12_evolution_data_237:

