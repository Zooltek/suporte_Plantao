; Pool de PHP-FPM da aplicação.
; Sobrescreve o pool default (www.conf) — o nome [www] garante substituição.
[www]
user = appuser
group = appuser
listen = 127.0.0.1:9000
listen.owner = appuser
listen.group = appuser

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Envia stdout/stderr dos workers para o container
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

; Preserva variáveis de ambiente (necessário para Laravel ler $_ENV)
clear_env = no

; Slow-log em requisições >10s (útil para diagnosticar latência em prod)
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2
