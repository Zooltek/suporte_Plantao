<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Background circle -->
  <circle cx="200" cy="220" r="160" fill="#FFF7ED" opacity="0.6"/>

  <!-- Desk -->
  <rect x="60" y="290" width="280" height="16" rx="8" fill="#F97316" opacity="0.3"/>
  <rect x="90" y="306" width="12" height="60" rx="6" fill="#F97316" opacity="0.3"/>
  <rect x="298" y="306" width="12" height="60" rx="6" fill="#F97316" opacity="0.3"/>

  <!-- Monitor -->
  <rect x="120" y="200" width="160" height="100" rx="10" fill="#1E293B"/>
  <rect x="128" y="208" width="144" height="84" rx="6" fill="#F8FAFC"/>
  <!-- Screen content lines -->
  <rect x="138" y="220" width="80" height="8" rx="4" fill="#F97316" opacity="0.7"/>
  <rect x="138" y="234" width="110" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="138" y="246" width="90" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="138" y="258" width="100" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="138" y="270" width="60" height="6" rx="3" fill="#E2E8F0"/>
  <!-- Monitor stand -->
  <rect x="191" y="300" width="18" height="20" rx="4" fill="#334155"/>
  <rect x="175" y="318" width="50" height="8" rx="4" fill="#334155"/>

  <!-- Person / Agent -->
  <!-- Head -->
  <circle cx="200" cy="155" r="35" fill="#FDBA74"/>
  <!-- Hair -->
  <ellipse cx="200" cy="128" rx="34" ry="16" fill="#1E293B"/>
  <!-- Face features -->
  <circle cx="190" cy="155" r="4" fill="#92400E" opacity="0.6"/>
  <circle cx="210" cy="155" r="4" fill="#92400E" opacity="0.6"/>
  <path d="M192 167 Q200 174 208 167" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Headset -->
  <path d="M166 148 Q165 120 200 118 Q235 120 234 148" stroke="#374151" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="160" y="145" width="12" height="20" rx="6" fill="#374151"/>
  <rect x="228" y="145" width="12" height="20" rx="6" fill="#374151"/>
  <!-- Mic -->
  <path d="M172 164 Q162 170 162 182" stroke="#374151" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="162" cy="185" r="5" fill="#F97316"/>

  <!-- Body / Shirt -->
  <path d="M155 190 Q155 195 145 210 L120 240 Q140 250 200 250 Q260 250 280 240 L255 210 Q245 195 245 190 Q225 200 200 200 Q175 200 155 190Z" fill="#F97316" opacity="0.9"/>

  <!-- Ticket card floating -->
  <g transform="rotate(-10, 310, 180)">
    <rect x="295" y="155" width="70" height="48" rx="8" fill="white" stroke="#FED7AA" stroke-width="2"/>
    <rect x="303" y="165" width="35" height="5" rx="2.5" fill="#F97316" opacity="0.7"/>
    <rect x="303" y="175" width="50" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="303" y="184" width="42" height="4" rx="2" fill="#CBD5E1"/>
    <circle cx="352" cy="170" r="5" fill="#10B981" opacity="0.8"/>
  </g>

  <!-- Chat bubble floating -->
  <g transform="rotate(8, 90, 170)">
    <rect x="55" y="148" width="64" height="44" rx="10" fill="#F97316" opacity="0.15" stroke="#FDBA74" stroke-width="1.5"/>
    <path d="M75 192 L68 202 L85 192Z" fill="#F97316" opacity="0.15"/>
    <rect x="63" y="158" width="40" height="5" rx="2.5" fill="#F97316" opacity="0.6"/>
    <rect x="63" y="168" width="48" height="4" rx="2" fill="#FDBA74"/>
    <rect x="63" y="177" width="35" height="4" rx="2" fill="#FDBA74"/>
  </g>
</svg>
